<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://create.gosim.org/" />
    <meta http-equiv="refresh" content="0; url=https://create.gosim.org/" />
    <title>GOSIM Create has moved</title>
  </head>
  <body>
    <p>
      GOSIM Create has moved to
      <a href="https://create.gosim.org/">create.gosim.org</a>.
    </p>
    <script>
      (function () {
        var path = window.location.pathname
        var oldEventBase = '/oaic-harness-2026'

        if (path === oldEventBase || path.indexOf(oldEventBase + '/') === 0) {
          path = '/factory26' + path.slice(oldEventBase.length)
        }

        window.location.replace(
          'https://create.gosim.org' + path + window.location.search + window.location.hash,
        )
      })()
    </script>
  </body>
</html>
